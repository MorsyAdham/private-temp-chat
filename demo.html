<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .message-bubble.system.demo-system-preview {
            flex: 0 0 auto;
            width: min(100%, 560px);
            min-width: min(92%, 560px);
            max-width: min(92%, 560px);
        }
    </style>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body data-theme="midnight-cute">
    <div class="wrapper">
        <div id="chat" class="container" style="display: flex;">
            <div class="header">
                <div class="header-left">
                    <h2>Our Room Demo 💕</h2>
                    <div id="connection-status" class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-text">Local demo only</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="header-mini-stat accent" onclick="openTodoModal()" title="Love Streak">
                        <span class="material-icons">local_fire_department</span>
                        <strong id="header-streak-text">0</strong>
                    </button>
                    <button id="todo-btn" class="icon-btn header-bubble-btn todo" onclick="openTodoModal()" title="Daily Checklist">
                        <span class="material-icons">favorite</span>
                    </button>
                    <button id="reload-btn" class="icon-btn header-bubble-btn" onclick="reloadChat()" title="Reset demo">
                        <span class="material-icons">refresh</span>
                    </button>
                    <div class="header-tools">
                        <button id="tools-toggle-btn" class="icon-btn header-bubble-btn" onclick="toggleHeaderTools(event)" title="More tools">
                            <span class="material-icons">tune</span>
                        </button>
                        <div id="header-tools-menu" class="header-tools-menu" style="display: none;">
                            <button id="app-view-btn" type="button" class="header-tool-item" onclick="toggleAppViewFromMenu()" title="Toggle full screen">
                                <span id="app-view-icon" class="material-icons">smartphone</span>
                                <span id="app-view-label" class="header-tool-label">App View</span>
                            </button>
                            <button type="button" class="header-tool-item" onclick="toggleSearchFromMenu()">
                                <span class="material-icons">search</span>
                                <span class="header-tool-label">Search</span>
                            </button>
                            <div class="header-tool-item theme-picker-row">
                                <label class="theme-picker-label" for="theme-select">
                                    <span id="theme-toggle-emoji" class="theme-toggle-emoji">💕</span>
                                    <span id="theme-toggle-label" class="header-tool-label">Theme</span>
                                </label>
                                <select id="theme-select" class="theme-select" onchange="setThemeFromMenu(this.value)" aria-label="Choose theme">
                                    <option value="midnight-cute">Midnight Cute</option>
                                    <option value="cute">Cute</option>
                                    <option value="classic">Classic</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="search-bar" class="search-bar" style="display: none;">
                <div class="search-input-wrapper">
                    <span class="material-icons search-icon">search</span>
                    <input type="text" id="search-input" placeholder="Search demo messages..." onkeyup="searchMessages()">
                </div>
                <div class="search-controls">
                    <button onclick="searchPrevious()" class="icon-btn-small" title="Previous">
                        <span class="material-icons">arrow_upward</span>
                    </button>
                    <button onclick="searchNext()" class="icon-btn-small" title="Next">
                        <span class="material-icons">arrow_downward</span>
                    </button>
                    <button onclick="closeSearch()" class="icon-btn-small" title="Close">
                        <span class="material-icons">close</span>
                    </button>
                </div>
            </div>

            <div id="floating-date" class="floating-date">
                <span class="floating-date-label">Today</span>
            </div>

            <div id="messages" class="messages-container">
                <button id="load-more-btn" class="load-btn" onclick="loadOlderMessages()">
                    <span class="material-icons">expand_less</span>
                    Load older demo messages
                </button>
                <button id="load-all-btn" class="load-btn" onclick="loadAllMessages()">
                    <span class="material-icons">history</span>
                    Load full demo chat
                </button>
            </div>

            <button id="jump-bottom-btn" class="jump-bottom" onclick="scrollToBottom(true)" style="display: none;">
                <span class="material-icons">arrow_downward</span>
            </button>

            <div id="reply-preview" class="reply-preview" style="display: none;">
                <div class="reply-content">
                    <span class="material-icons">reply</span>
                    <div class="reply-text">
                        <strong id="reply-name"></strong>
                        <p id="reply-message"></p>
                    </div>
                </div>
                <button onclick="cancelReply()" class="icon-btn-small">
                    <span class="material-icons">close</span>
                </button>
            </div>

            <div class="input-area">
                <button class="icon-btn" onclick="openAttachmentMenu()" title="Attach">
                    <span class="material-icons">add</span>
                </button>
                <textarea id="msg" placeholder="Type a message..." rows="1"></textarea>
                <button id="send-btn" onclick="send()" class="icon-btn primary">
                    <span class="material-icons">send</span>
                </button>
                <button id="voice-btn" class="icon-btn" onclick="toggleVoiceRecording()" title="Voice message">
                    <span class="material-icons">mic</span>
                </button>
            </div>

            <div id="voice-recording" class="voice-recording" style="display: none;">
                <button id="voice-preview-play" class="voice-play-btn voice-preview-play" onclick="toggleVoicePreviewPlayback()"
                    style="display: none;">
                    <span class="material-icons">play_arrow</span>
                </button>
                <div id="voice-recording-indicator" class="recording-animation">
                    <span class="material-icons pulse">mic</span>
                </div>
                <div class="voice-recording-main">
                    <span id="recording-time">0:00</span>
                    <input id="voice-preview-slider" class="voice-preview-slider" type="range" min="0" max="0" step="0.1"
                        value="0" style="display: none;" oninput="seekVoicePreview(event)">
                    <div id="voice-preview-times" class="voice-preview-times" style="display: none;">
                        <span id="voice-preview-current">0:00</span>
                        <span id="voice-preview-total">0:00</span>
                    </div>
                </div>
                <button onclick="cancelVoiceRecording()" class="icon-btn-small">
                    <span class="material-icons">delete</span>
                </button>
                <button id="voice-finish-btn" onclick="finishVoiceRecording()" class="icon-btn-small primary">
                    <span class="material-icons">stop</span>
                </button>
                <button id="voice-send-btn" onclick="sendVoiceRecording()" class="icon-btn-small primary"
                    style="display: none;">
                    <span class="material-icons">send</span>
                </button>
            </div>
        </div>
    </div>

    <div id="attachment-menu" class="modal" style="display: none;">
        <div class="modal-content attachment-menu">
            <h3>Send in demo</h3>
            <div class="attachment-grid">
                <button onclick="openCamera()" class="attachment-option">
                    <span class="material-icons">camera_alt</span>
                    <span>Camera</span>
                </button>
                <button onclick="openGallery()" class="attachment-option">
                    <span class="material-icons">photo_library</span>
                    <span>Gallery</span>
                </button>
                <button onclick="openVideoSelector()" class="attachment-option">
                    <span class="material-icons">videocam</span>
                    <span>Video</span>
                </button>
            </div>
            <button onclick="closeAttachmentMenu()" class="btn-secondary">Cancel</button>
        </div>
    </div>

    <div id="image-preview-modal" class="modal" style="display: none;">
        <div class="modal-content media-preview">
            <div class="preview-header">
                <h3>Send Photos</h3>
                <button onclick="cancelImageSend()" class="icon-btn">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div id="preview-images-container" class="preview-images"></div>
            <div class="preview-options">
                <label class="view-once-toggle">
                    <input type="checkbox" id="view-once-checkbox">
                    <span class="material-icons">lock</span>
                    <span>View once</span>
                </label>
            </div>
            <button onclick="confirmImageSend()" class="btn-primary full-width">
                <span class="material-icons">send</span>
                Send
            </button>
        </div>
    </div>

    <div id="video-preview-modal" class="modal" style="display: none;">
        <div class="modal-content media-preview">
            <div class="preview-header">
                <h3>Send Video</h3>
                <button onclick="cancelVideoSend()" class="icon-btn">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <video id="preview-video" controls></video>
            <div class="preview-options">
                <label class="view-once-toggle">
                    <input type="checkbox" id="video-view-once-checkbox">
                    <span class="material-icons">lock</span>
                    <span>View once</span>
                </label>
            </div>
            <button onclick="confirmVideoSend()" class="btn-primary full-width">
                <span class="material-icons">send</span>
                Send
            </button>
        </div>
    </div>

    <div id="image-viewer-modal" class="modal" style="display: none;" onclick="closeImageViewerOnOutsideClick(event)">
        <div class="modal-content image-viewer">
            <button class="close-viewer" onclick="closeImageViewer()">
                <span class="material-icons">close</span>
            </button>
            <img id="viewer-image" src="" alt="Image">
            <div id="viewer-info"></div>
        </div>
    </div>

    <div id="video-viewer-modal" class="modal" style="display: none;" onclick="closeVideoViewerOnOutsideClick(event)">
        <div class="modal-content video-viewer">
            <button class="close-viewer" onclick="closeVideoViewer()">
                <span class="material-icons">close</span>
            </button>
            <video id="viewer-video" controls></video>
        </div>
    </div>

    <div id="todo-modal" class="modal" style="display: none;" onclick="closeTodoModalOnOutsideClick(event)">
        <div class="modal-content todo-modal">
            <div class="todo-header">
                <div>
                    <p class="todo-kicker">🧪 Safe local sandbox</p>
                    <h3>🌸 Demo Checklist 💕</h3>
                    <div id="todo-subtitle" class="todo-subtitle todo-total-card">Everything here stays in this demo tab.</div>
                </div>
                <button onclick="closeTodoModal()" class="icon-btn">
                    <span class="material-icons">close</span>
                </button>
            </div>

            <div class="todo-stats">
                <div class="todo-stat-card">
                    <span class="todo-stat-label">Progress</span>
                    <strong id="todo-progress-text">0 / 0 done</strong>
                </div>
                <div class="todo-stat-card accent">
                    <span class="todo-stat-label">Score</span>
                    <strong id="todo-score-text">💕 0 points</strong>
                </div>
            </div>

            <div id="todo-category-nav" class="todo-category-nav"></div>
            <div id="todo-list" class="todo-list"></div>

            <div class="todo-footer">
                <p id="todo-footer-note">Test as much as you want here. Nothing gets synced anywhere.</p>
            </div>
        </div>
    </div>

    <input type="file" id="image-input" accept="image/*" multiple style="display: none;"
        onchange="handleImageSelect(event)">
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;"
        onchange="handleImageSelect(event)">
    <input type="file" id="video-input" accept="video/*" style="display: none;" onchange="handleVideoSelect(event)">

    <script src="demo.js"></script>
</body>

</html>
